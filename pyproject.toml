[project]
name = "carchive"
version = "0.9.0"
description = "Collects, stores and shows vehicle data delivered under the EU Data Act"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "babel>=2.18.0",
    "cryptography>=50.0.2",
    "fastapi>=0.161.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.4.0",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
carchive = "carchive.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.1",
    "types-reportlab>=5.0.0.20261008",
    "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carchive"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "."]
asyncio_mode = "auto"
markers = ["slow: slower tests (still run by default, not excluded)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]
# Google style documents __init__ arguments in the class docstring.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"test_*.py" = ["D"]
"eu_data_act_sampler.py" = ["D"]
"inventory.py" = ["D"]
"scheduling.py" = ["D"]
"captures_view.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["carchive"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = [
    "src",
    "tests",
    "eu_data_act_sampler.py",
    "test_eu_data_act_sampler.py",
    "inventory.py",
    "test_inventory.py",
    "scheduling.py",
    "test_scheduling.py",
    "captures_view.py",
    "test_captures_view.py",
]
